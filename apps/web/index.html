<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b3121b" />

    <!-- 好友主要是从微信里点进来的，这几条决定了他看到的分享卡片长什么样 -->
    <title>非工作时间约会审批系统</title>
    <meta
      name="description"
      content="牛马出栏审批处，仅受理非工作时间约会业务。选个时间，点两下就交上去了。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="非工作时间约会审批系统" />
    <meta
      property="og:description"
      content="牛马出栏审批处，仅受理非工作时间约会业务。选个时间，点两下就交上去了。"
    />
    <meta property="og:site_name" content="牛马出栏审批处" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 加到主屏幕，用起来就像个小程序 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="牛马审批" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <!--
      #root 里这段是「JS 还没加载出来」时的兜底，React 一挂载就会被替换掉。

      为什么要放它：JS 文件加载失败时（网络断了、隧道挂了、网关 502），
      页面会是**一整片纯白** —— 好友会以为你发了个坏链接，而不是「稍后再试」。
      实测过：隧道配错那次，手机上看到的就是白屏。

      内联样式是故意的：这种情况下 styles.css 本身很可能也没加载出来。
    -->
    <div id="root">
      <div
        style="
          padding: 48px 24px;
          text-align: center;
          font: 15px/1.9 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
          color: #7d7364;
        "
      >
        <p style="margin: 0 0 14px; font-size: 17px; color: #b3121b">正在打开…</p>
        <p style="margin: 0">要是停在这儿不动，<strong>下拉刷新</strong>一下。</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
