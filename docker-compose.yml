# 一条命令起一个**可以随时彻底删干净**的实例。
#
#   docker compose up -d        起（第一次会自动构建镜像）
#   docker compose logs -f app  看日志，后台口令就在里面（第一次启动时打印一次）
#   docker compose down         停掉，数据留着
#   docker compose down -v      停掉**并把数据卷一起删掉** —— 一点都不剩
#
# 端口映射 "8787:8787" 两边看着一样，但含义不同：
#   左边 = 你电脑（或服务器）上对外开放的端口 ← 浏览器访问的是这个
#   右边 = 容器里 Node 监听的端口（Dockerfile 里 ENV PORT=8787），别动
#
# **左边故意也是 8787**，不是随便定的：deploy/Caddyfile 和 deploy/nginx.conf
# 里写的是 reverse_proxy 127.0.0.1:8787。改成别的数，服务器上挂 HTTPS 时反代就指错了。
#
# 想同时跑两个实例（比如一份真实数据 + 一份随便玩的），就自己改左边那个数 ——
# scripts/sandbox.mjs 起的是 8788，正是为了不和这个撞。

services:
  app:
    build: .
    image: niumadate
    container_name: niumadate
    ports:
      # 只绑**本机回环**：同一 WiFi 下的别人（比如 192.168.0.104:8787）也访问不到。
      #
      # 为什么这样也够用：隧道（cloudflared）和服务器上的 Caddy / Nginx
      # 都是从**宿主机**连 127.0.0.1:8787 的，回环地址它们够得着。
      # 想让局域网里的手机直连调试，改成 "8787:8787" 就放开了 ——
      # 但那样同一网络下的人也能打开后台登录页，心里有数就行。
      - "127.0.0.1:8787:8787"
    volumes:
      - niumadate-data:/data
    restart: unless-stopped

    # 日志轮转。**Docker 默认不限制日志大小** —— 一个长期运行的容器
    # 会把 json 日志无限写下去，几个月后能把磁盘撑满。
    # 这里每条容器最多留 3 个文件、每个 5MB，也就是最多 15MB。
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    environment:
      # 想自己定后台口令就取消注释（不填的话第一次启动会随机生成、打印一次）
      # ADMIN_PASSWORD: 换成一个又长又好记的

      # 信任反向代理传来的 X-Forwarded-For。**容器里请保持打开。**
      #
      # 不打开会怎样：请求进容器时源 IP 全是 Docker 的网关地址（172.18.0.1），
      # 于是**所有好友在限流眼里是同一个人**，一个人刷几条就把大家全挡住了；
      # 日志里的来源 IP 也全是 172.18.0.1，出事没法查。
      #
      # 云隧道（cloudflared）和 Caddy / Nginx 都会带上真实的客户端 IP，所以开着是对的。
      TRUST_PROXY: "true"

      LOG_LEVEL: info

volumes:
  niumadate-data:
